apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: whiteboarder
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  project: whiteboarder
  source:
    repoURL: https://github.com/LinusThorsell/kubes.git
    targetRevision: main
    path: manifests/whiteboarder
  destination:
    server: https://kubernetes.default.svc
    namespace: whiteboarder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
