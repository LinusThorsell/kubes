apiVersion: v1
kind: Namespace
metadata:
  name: whiteboarder
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: whiteboarder-quota
  namespace: whiteboarder
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "1500m"
    limits.memory: "1Gi"
    pods: "5"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: whiteboarder-limits
  namespace: whiteboarder
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
