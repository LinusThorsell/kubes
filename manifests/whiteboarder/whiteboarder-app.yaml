apiVersion: apps/v1
kind: Deployment
metadata:
  name: whiteboarder
  namespace: whiteboarder
  labels:
    app: whiteboarder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whiteboarder
  template:
    metadata:
      labels:
        app: whiteboarder
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: whiteboarder
          image: ghcr.io/linusthorsell/whiteboarder:sha-012d178
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: ORIGIN
              value: "https://whiteboarder.linusthorsell.se"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: whiteboarder
  namespace: whiteboarder
spec:
  selector:
    app: whiteboarder
  ports:
    - port: 80
      targetPort: 3000
