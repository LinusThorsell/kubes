apiVersion: apps/v1
kind: Deployment
metadata:
  name: drone-multiplayer
  namespace: drone
  labels:
    app: drone-multiplayer
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: drone-multiplayer
  template:
    metadata:
      labels:
        app: drone-multiplayer
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: multiplayer
          image: ghcr.io/linusthorsell/how_to_tame_a_drone-multiplayer:sha-0b66fbb
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - name: websocket
              containerPort: 3001
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          startupProbe:
            httpGet:
              path: /healthz
              port: websocket
            failureThreshold: 20
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: websocket
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: websocket
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: multiplayer
  namespace: drone
spec:
  selector:
    app: drone-multiplayer
  ports:
    - name: websocket
      port: 3001
      targetPort: websocket
