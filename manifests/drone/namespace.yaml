apiVersion: v1
kind: Namespace
metadata:
  name: drone
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: drone-quota
  namespace: drone
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: "512Mi"
    limits.cpu: "2000m"
    limits.memory: "1Gi"
    pods: "4"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: drone-limits
  namespace: drone
spec:
  limits:
    - type: Container
      default:
        cpu: "250m"
        memory: "128Mi"
      defaultRequest:
        cpu: "20m"
        memory: "32Mi"
