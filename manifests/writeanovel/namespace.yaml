apiVersion: v1
kind: Namespace
metadata:
  name: writeanovel
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: writeanovel-quota
  namespace: writeanovel
spec:
  hard:
    requests.cpu: "1000m"
    requests.memory: "1Gi"
    limits.cpu: "4000m"
    limits.memory: "2Gi"
    requests.storage: "10Gi"
    persistentvolumeclaims: "2"
    pods: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: writeanovel-limits
  namespace: writeanovel
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: "256Mi"
      defaultRequest:
        cpu: "50m"
        memory: "64Mi"
