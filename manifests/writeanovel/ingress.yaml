apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: writeanovel
  namespace: writeanovel
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - writeanovel.linus.solutions
      secretName: writeanovel-linus-solutions-tls
  rules:
    - host: writeanovel.linus.solutions
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: writeanovel
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pocketbase
  namespace: writeanovel
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/limit-connections: "10"
    nginx.ingress.kubernetes.io/limit-rps: "5"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - writeanovel-pb.linus.solutions
      secretName: writeanovel-pocketbase-tls
  rules:
    - host: writeanovel-pb.linus.solutions
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pocketbase
                port:
                  number: 8090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pocketbase-admin-public-deny
  namespace: writeanovel
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/whitelist-source-range: "127.0.0.1/32"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - writeanovel-pb.linus.solutions
      secretName: writeanovel-pocketbase-tls
  rules:
    - host: writeanovel-pb.linus.solutions
      http:
        paths:
          - path: /_/
            pathType: Prefix
            backend:
              service:
                name: pocketbase
                port:
                  number: 8090
          - path: /api/collections/_superusers
            pathType: Prefix
            backend:
              service:
                name: pocketbase
                port:
                  number: 8090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: writeanovel-pocketbase-admin
  namespace: writeanovel
spec:
  ingressClassName: tailscale
  tls:
    - hosts:
        - writeanovel-pocketbase-admin
  rules:
    - host: writeanovel-pocketbase-admin
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pocketbase
                port:
                  number: 8090
