apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: hcloud-volumes-expandable
provisioner: csi.hetzner.cloud
allowVolumeExpansion: true
volumeBindingMode: Immediate
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pocketbase-data
spec:
  capacity:
    storage: 10Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hcloud-volumes-expandable
  csi:
    driver: csi.hetzner.cloud
    volumeHandle: "105901197"
    fsType: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pocketbase-data
  namespace: blog
spec:
  storageClassName: hcloud-volumes-expandable
  volumeName: pocketbase-data
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocketbase
  namespace: blog
  labels:
    app: pocketbase
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pocketbase
  template:
    metadata:
      labels:
        app: pocketbase
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pocketbase
          image: ghcr.io/muchobien/pocketbase:latest
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8090
          env:
            - name: PB_HOST
              value: "0.0.0.0"
            - name: PB_PORT
              value: "8090"
          volumeMounts:
            - name: data
              mountPath: /pb_data
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8090
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocketbase-data
---
apiVersion: v1
kind: Service
metadata:
  name: pocketbase
  namespace: blog
spec:
  selector:
    app: pocketbase
  ports:
    - port: 8090
      targetPort: 8090
